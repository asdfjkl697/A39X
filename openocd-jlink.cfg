# ============================================================
#  openocd-jlink.cfg — GD32F303VG (Cortex-M4) 经 SEGGER J-Link (SWD)
#  用途：作为 ARM LiveWatch 插件的调试服务器（默认监听 TCL 端口 6666）
#  启动：openocd -f openocd-jlink.cfg
#
#  说明：OpenOCD 没有官方 GD32F30x 脚本，这里手动建 Cortex-M4 target。
#        Live Watch 只需读写 RAM，不配 Flash 也能正常改全局变量值。
# ============================================================

adapter driver jlink
adapter speed 1000

# 必须先选 transport 再 source swj-dp.tcl（swj-dp.tcl 源码顶部会读当前 transport，
# 顺序反了会报 "unable to select a session transport"）
transport select swd
source [find target/swj-dp.tcl]

set _CHIPNAME gd32f303

# Cortex-M4，SWD DPIDR = 0x2BA01477（与 JLinkLog.txt 实测一致）
swj_newdap $_CHIPNAME cpu -irlen 4 -expected-id 0x2ba01477
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
target create $_CHIPNAME.cpu cortex_m -dap $_CHIPNAME.dap

# GD32F303VG: 96KB SRAM @ 0x20000000，作 work-area
$_CHIPNAME.cpu configure -work-area-phys 0x20000000 \
                         -work-area-size 0x4000 \
                         -work-area-backup 0

reset_config srst_nogate

# 注意：如需用 OpenOCD 烧录 Flash 需另配 gd32f30x flash 驱动（官方无此驱动），
#       建议烧录继续走你现有的 cortex-debug + JLinkGDBServer，OpenOCD 只服务 Live Watch。
